<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura – The Cognitive Bridge</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-height: 520px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f1e 0%, #1a1a2e 50%, #16213e 100%);
      color: #e2e8f0;
      padding: 16px;
    }

    h1 {
      text-align: center;
      font-size: 20px;
      background: linear-gradient(135deg, #a78bfa, #818cf8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 14px;
    }

    textarea {
      width: 100%;
      min-height: 72px;
      background: #111827;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      font-size: 13px;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: #6366f1;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    .btn {
      flex: 1;
      padding: 9px 6px;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:hover {
      opacity: 0.85;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-generate {
      background: #6366f1;
    }

    .btn-rewrite {
      background: #475569;
    }

    .btn-summary {
      background: #334155;
    }

    .btn-insert {
      background: #22c55e;
      margin-top: 8px;
      width: 100%;
    }

    #errorArea {
      margin-top: 8px;
      padding: 8px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 6px;
      color: #f87171;
      font-size: 12px;
      display: none;
    }

    #outputArea {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.5;
    }

    .reply-box {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      white-space: pre-wrap;
    }

    .analyzer {
      padding: 10px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 8px;
      font-size: 11px;
      margin-bottom: 8px;
    }

    .analyzer strong {
      color: #a5b4fc;
    }

    .analyzer-grid {
      display: grid;
      gap: 3px;
      margin-top: 4px;
    }

    .summary-card {
      padding: 12px;
      background: rgba(51, 65, 85, 0.5);
      border: 1px solid rgba(71, 85, 105, 0.6);
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .why-toggle {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 11px;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      margin-bottom: 6px;
    }

    .why-content {
      display: none;
      padding: 6px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      font-size: 11px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .confidence-badge {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .meta-row {
      font-size: 11px;
      color: #64748b;
      margin-top: 6px;
    }
  </style>
</head>

<body>
  <h1>🧠 Aura</h1>
  <p class="subtitle">The Cognitive Bridge for Authentic Connection</p>

  <textarea id="intentInput" placeholder="Type your raw thought…"></textarea>

  <div class="btn-row">
    <button id="generateBtn" class="btn btn-generate">Generate</button>
    <button id="rewriteBtn" class="btn btn-rewrite">Rewrite Draft</button>
    <button id="summaryBtn" class="btn btn-summary">Summarize</button>
  </div>

  <div id="errorArea"></div>
  <div id="outputArea"></div>

  <script src="popup.js"></script>
</body>

</html>
